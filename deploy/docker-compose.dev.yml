services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: texas
      POSTGRES_USER: texas
      POSTGRES_PASSWORD: texas_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - texas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U texas -d texas"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - texas_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  texas_postgres_data:
  texas_redis_data:
