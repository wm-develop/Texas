name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支上的新推送取消仍在跑的旧任务，避免排队浪费
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Go 游戏服务
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/game_server

    # 真实 PostgreSQL：内存仓储的单元测试拦不住 SQL 与真实库的错配（列数、
    # 约束、索引），这类问题在本项目已经造成过一次 P0，而集成测试在没有
    # TEST_DATABASE_URL 时会静默跳过——没人跑就等于没有。
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: texas
          POSTGRES_PASSWORD: texas_ci
          POSTGRES_DB: texas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U texas -d texas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # 一次性测试库，用完随容器销毁。每个用例在库里新建自己的 schema。
      TEST_DATABASE_URL: postgres://texas:texas_ci@127.0.0.1:5432/texas_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/game_server/go.mod
          cache-dependency-path: services/game_server/go.sum

      - name: 检查 gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: 确认集成测试没有被跳过
        # 集成测试在缺少 TEST_DATABASE_URL 时会 t.Skip。一旦服务容器或环境
        # 变量出问题，全量测试仍然全绿，真实库的覆盖会在无人察觉中消失。
        # 这一步显式检查它们真的跑了。
        run: |
          output="$(go test ./internal/account/ ./internal/chat/ ./internal/postgres/ ./internal/room/             -count=1 -v -run 'Postgres|Migrator')"
          echo "$output"
          if echo "$output" | grep -q '^--- SKIP'; then
            echo "::error::集成测试被跳过，TEST_DATABASE_URL 没有生效"
            exit 1
          fi
          if ! echo "$output" | grep -q 'PASS: TestPostgresPhase3PersistenceFlow'; then
            echo "::error::没有跑到房间持久化集成测试"
            exit 1
          fi

      - name: go test
        # -count=1 禁用测试缓存
        run: go test ./... -count=1

      - name: 反复运行传输层用例
        # WebSocket 用例依赖异步广播的到达顺序，竞态在慢机器上才偶发。
        # 单次绿色不足以说明稳定，这里连跑多轮把不稳定的用例钉出来。
        run: go test ./internal/transport/ -count=5

      - name: go test -race
        # 单独一步：牌桌是单写者模型，一旦被破坏必须暴露。
        # 与上一步分开便于区分「功能失败」和「数据竞争」。
        # 该检查需要 cgo，Windows 开发机通常无法本地运行，以 CI 结果为准。
        run: go test ./... -count=1 -race

  client:
    name: Flutter 客户端
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/poker_client
    # 步骤顺序不可调整：本项目含 ohos 平台插件，Flutter OH 连 `pub get`
    # 都会校验 HarmonyOS SDK，缺少时报
    # `No Hmos SDK found. Try setting the HOS_SDK_HOME environment variable.`
    # 因此必须先装命令行工具与 JDK，再装 Flutter OH。
    steps:
      - uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y curl xz-utils zip libglu1-mesa
        working-directory: .

      - name: 安装 HarmonyOS 命令行工具
        # 该 action 会设置 HOS_SDK_HOME 与 OHOS_NDK_HOME。
        # 版本号必须取自 ErBWs/ohos-sdk 的实际 release，26.0.0.621 对应本项目
        # 记录的 HarmonyOS API 26，不可随意填写。
        uses: ErBWs/setup-ohos@v1
        with:
          version: "26.0.0.621"
          cache: true

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: 安装 Flutter OH
        # 本项目使用 CPF-Flutter 的 OpenHarmony 分支，标准 Flutter 无法解析
        # ohos 平台插件，必须克隆同一分支
        run: |
          git clone -b oh-3.41.9-dev --single-branch \
            https://gitcode.com/CPF-Flutter/flutter_flutter.git \
            "$GITHUB_WORKSPACE/flutter"
          echo "$GITHUB_WORKSPACE/flutter/bin" >> "$GITHUB_PATH"
        working-directory: .

      - name: 输出工具链版本
        run: flutter --version

      - name: 解析依赖
        # 跳过 HarmonyOS 音频插件仓库中与构建无关的示例工程大文件
        env:
          GIT_LFS_SKIP_SMUDGE: 1
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

  hygiene:
    name: 仓库卫生与脚本检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: 检查 shell 脚本
        # 备份与恢复脚本直接操作生产数据，静态检查是必须的最低保障。
        # 限定 warning 及以上，避免风格类提示阻塞流水线。
        run: shellcheck --severity=warning deploy/backup/*.sh scripts/*.sh

      - name: 敏感文件、密钥与文档链接
        run: ./scripts/check-repo-hygiene.sh
